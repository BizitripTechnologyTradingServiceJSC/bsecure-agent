# Only needed if ALLOW_CONFIG_CHANGES=true. Install as /etc/systemd/system/fwagent.service.d/config.conf
# Lets the agent edit these config trees (files stay owned by root; no extra capabilities are needed because the agent
# runs as root and only touches root-owned files and signals root-owned processes).
# UNTESTED on a real systemd host: verify `systemctl reload-or-restart` works from inside this sandbox before relying on it.
[Service]
ReadWritePaths=/etc/ssh /etc/nginx /etc/tinyproxy /etc/tinyproxy.conf
