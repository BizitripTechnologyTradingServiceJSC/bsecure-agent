# Only needed if ALLOW_CONFIG_CHANGES=true. Install as /etc/systemd/system/fwagent.service.d/config.conf
# UNTESTED on a real host: verify that `systemctl reload-or-restart` works from inside this sandbox before relying on it.
[Service]
ReadWritePaths=/var/lib/fwagent /etc/ssh /etc/nginx /etc/tinyproxy /etc/tinyproxy.conf
CapabilityBoundingSet=CAP_NET_ADMIN CAP_DAC_OVERRIDE CAP_FOWNER CAP_CHOWN
